name: miniaudio migration checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'ios/**'
      - 'linux/**'
      - 'macos/**'
      - '.github/workflows/miniaudio-check.yml'
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Android APK
        run: flutter build apk --debug

  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Flutter build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev libasound2-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Linux desktop
        run: flutter build linux --debug

  ios-build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CFLAGS_aarch64_apple_ios: "-x objective-c"
      CFLAGS_aarch64_apple_ios_sim: "-x objective-c"
      CFLAGS_x86_64_apple_ios: "-x objective-c"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build unsigned iOS app with native compiler diagnostics
        shell: bash
        run: |
          set +e
          flutter build ios --release --no-codesign --verbose > /tmp/orchid-ios-build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::group::First relevant native compiler errors"
            grep -n -m 45 -E 'error:|Error \(Xcode\)|CompileC|clang .*\\.c |NSObjCRuntime|fatal error:' /tmp/orchid-ios-build.log || true
            echo "::endgroup::"
            echo "::group::Last 120 lines"
            tail -120 /tmp/orchid-ios-build.log
            echo "::endgroup::"
          fi
          exit "$code"
      - name: Attach full iOS compiler transcript on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miniaudio-ios-verbose-log
          path: /tmp/orchid-ios-build.log
          retention-days: 7
