name: Orchid iOS / TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Upload signed iOS build to TestFlight"
        required: true
        type: boolean
        default: true
  # Unsigned build on PRs so compile errors show up early
  pull_request:

concurrency:
  group: orchid-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v6

      # Only the device target is needed for `flutter build ios` / `flutter build ipa`.
      # Add aarch64-apple-ios-sim and x86_64-apple-ios back if you build for the simulator.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Caches CocoaPods' download cache (not the Pods folder), keyed on pubspec.lock.
      # Safe without a committed Podfile.lock: a stale entry only means re-downloading.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      # miniaudio_player_rust compiles its C bridge as plain C on iOS, but miniaudio's
      # iOS backend is Objective-C. Patch the checked-out build.rs so it compiles as
      # Objective-C and links the needed frameworks. Idempotent (the pub cache is cached).
      # Remove this step once you use a fork / upstream fix.
      - name: Patch miniaudio_player_rust build.rs for iOS
        run: |
          set -euo pipefail
          PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          REF=$(awk '/^  miniaudio_player:/{f=1} f && /resolved-ref:/{gsub(/"/,"",$2); print $2; exit}' pubspec.lock)
          if [[ -z "$REF" ]]; then
            echo "::error::Could not find miniaudio_player resolved-ref in pubspec.lock"
            exit 1
          fi
          BUILD_RS="$PUB_CACHE_DIR/git/miniaudio_player-$REF/rust/build.rs"
          if [[ ! -f "$BUILD_RS" ]]; then
            echo "::error::build.rs not found at $BUILD_RS"
            exit 1
          fi
          python3 - "$BUILD_RS" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          if "objective-c" in s:
              print("build.rs already patched")
              sys.exit(0)
          marker = 'build.compile("miniaudio_bridge");'
          if marker not in s:
              sys.exit("marker not found in build.rs; patch needs updating for this commit")
          patch = '''if target_os == "ios" {
                  build.flag("-x").flag("objective-c");
                  println!("cargo:rustc-link-lib=objc");
                  for framework in [
                      "Foundation",
                      "CoreFoundation",
                      "CoreAudio",
                      "AudioToolbox",
                      "AVFoundation",
                      "AVFAudio",
                      "UIKit",
                  ] {
                      println!("cargo:rustc-link-lib=framework={framework}");
                  }
              }
              '''
          open(p, "w").write(s.replace(marker, patch + marker, 1))
          print("patched", p)
          PY
          grep -n "objective-c" "$BUILD_RS"

      - name: Pin iOS deployment target for cargo builds
        run: |
          mkdir -p "$HOME/.cargo"
          cat >> "$HOME/.cargo/config.toml" <<'EOF'
          [env]
          IPHONEOS_DEPLOYMENT_TARGET = "13.0"
          EOF

      - name: Generate Orchid iOS app icons
        run: bash scripts/generate_ios_icons.sh

      - name: Build unsigned iOS app (pull requests)
        if: ${{ github.event_name == 'pull_request' }}
        run: flutter build ios --release --no-codesign -v

      - name: Install App Store signing identity
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$BUILD_CERTIFICATE_BASE64" || -z "$P12_PASSWORD" || -z "$BUILD_PROVISION_PROFILE_BASE64" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "::error::Missing iOS signing secrets. See docs/testflight.md"
            exit 1
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/orchid.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/orchid-signing.keychain-db"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/orchid-profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/orchid-profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/orchid-profile.plist")
          echo "Profile: $PROFILE_NAME / $PROFILE_UUID"
          if [[ "$PROFILE_NAME" != "Orchid" ]]; then
            echo "::error::Expected provisioning profile named Orchid; got $PROFILE_NAME."
            exit 1
          fi
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          security find-identity -v -p codesigning

      # One command does build + archive + export. -v is verbose so any Rust/linker
      # error shows up in the log; remove it once the build is stable.
      - name: Archive and export signed IPA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BUILD_NAME: "0.1.0"
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          flutter build ipa --release -v \
            --export-options-plist=ios/ExportOptions.plist \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"

          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          if [[ -z "$IPA_PATH" ]]; then
            echo "::error::No IPA produced"
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Preserve signed IPA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: orchid-ios-ipa
          path: ${{ env.IPA_PATH }}
          archive: false

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_testflight }}
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: false
