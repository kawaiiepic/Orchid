name: Orchid iOS / TestFlight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Upload signed iOS build to TestFlight"
        required: true
        type: boolean
        default: true

concurrency:
  group: orchid-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
          pub-cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Build unsigned iOS app (pull requests)
        if: ${{ github.event_name == 'pull_request' }}
        run: flutter build ios --release --no-codesign

      - name: Install App Store signing identity
        if: ${{ github.event_name != 'pull_request' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$BUILD_CERTIFICATE_BASE64" || -z "$P12_PASSWORD" || -z "$BUILD_PROVISION_PROFILE_BASE64" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "::error::Missing iOS signing secrets. See docs/testflight.md"
            exit 1
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/orchid.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/orchid-signing.keychain-db"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/orchid-profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/orchid-profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/orchid-profile.plist")
          echo "Profile: $PROFILE_NAME / $PROFILE_UUID"
          if [[ "$PROFILE_NAME" != "Orchid" ]]; then
            echo "::error::Expected provisioning profile named Orchid; got $PROFILE_NAME."
            exit 1
          fi
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          security find-identity -v -p codesigning

      - name: Archive and export signed IPA
        if: ${{ github.event_name != 'pull_request' }}
        env:
          BUILD_NAME: "0.1.0"
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive \
            MARKETING_VERSION="$BUILD_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            FLUTTER_BUILD_NAME="$BUILD_NAME" \
            FLUTTER_BUILD_NUMBER="$BUILD_NUMBER"

          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa

          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          if [[ -z "$IPA_PATH" ]]; then
            echo "::error::No IPA produced"
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Preserve signed IPA
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: orchid-ios-ipa
          path: ${{ env.IPA_PATH }}
          archive: false

      - name: Upload to TestFlight
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload_testflight) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testflight]')) }}
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: false
