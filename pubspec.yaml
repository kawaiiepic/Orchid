name: orchid
description: Music player with Eclipse addon support.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shadcn_flutter: ^0.0.53
  http: ^1.2.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: any
  media_kit_libs_windows_audio: any

  shared_preferences: ^2.3.3
  cached_network_image: ^4.0.4
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  characters: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
