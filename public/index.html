<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orchid</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <h1>Orchid</h1>
    <p class="sub">Music player · Eclipse addons</p>
  </header>

  <main>
    <section class="panel" id="addons-panel">
      <div class="panel-head">
        <h2>Addons</h2>
        <button type="button" id="toggle-addons" class="ghost">Hide</button>
      </div>
      <div id="addons-body">
        <form id="add-addon-form" class="row">
          <input type="url" id="addon-url" placeholder="https://your-addon.com/ or …/manifest.json" required />
          <button type="submit">Add</button>
        </form>
        <p class="hint">Paste any Eclipse-compatible addon base URL. It must expose /manifest.json, /search, and /stream.</p>
        <ul id="addon-list" class="list"></ul>
      </div>
    </section>

    <section class="panel">
      <form id="search-form" class="row">
        <input type="search" id="search-q" placeholder="Search songs…" autocomplete="off" />
        <button type="submit">Search</button>
      </form>
      <div id="search-status" class="status"></div>
      <ul id="results" class="list results"></ul>
    </section>
  </main>

  <footer class="player" id="player-bar" hidden>
    <div class="now">
      <img id="now-art" alt="" width="48" height="48" />
      <div>
        <div id="now-title">—</div>
        <div id="now-artist" class="muted">—</div>
      </div>
    </div>
    <div class="controls">
      <button type="button" id="btn-play" aria-label="Play/Pause">▶</button>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" />
      <span id="time" class="muted">0:00 / 0:00</span>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
